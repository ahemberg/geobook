name: Release image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ahemberg/geobook

jobs:
  version:
    name: Release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      stable: ${{ steps.check.outputs.stable }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the tagged commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a version tag on main's history
        id: check
        run: python3 scripts/release.py check "$GITHUB_REF_NAME" "${{ steps.commit.outputs.commit }}" >> "$GITHUB_OUTPUT"

  application:
    name: Application
    needs: version
    uses: ./.github/workflows/backend-tests.yml

  frontend:
    name: Frontend
    needs: version
    uses: ./.github/workflows/frontend-tests.yml

  security:
    name: Security
    needs: version
    uses: ./.github/workflows/security.yml

  publish:
    name: Publish image
    needs: [version, application, frontend, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-image-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for an earlier publication of this version
        id: registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py published "$IMAGE" "$VERSION" "$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Download the verified application
        if: steps.registry.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: packaged-application
          path: target

      - name: Set up Buildx
        if: steps.registry.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.registry.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish AMD64 and ARM64 from the verified application
        if: steps.registry.outputs.publish == 'true'
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${COMMIT}"
          --label "org.opencontainers.image.version=${VERSION}"
          --label "org.opencontainers.image.licenses=MIT"
          --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --annotation "index:org.opencontainers.image.revision=${COMMIT}"
          --annotation "index:org.opencontainers.image.version=${VERSION}"
          --annotation "index:org.opencontainers.image.licenses=MIT"
          --output "type=image,name=${IMAGE}:${VERSION},push=true,oci-mediatypes=true"
          .

  latest:
    name: Update latest
    needs: [version, publish]
    if: needs.version.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-image-latest
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find the highest published stable version
        id: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py latest "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at the highest stable version
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${{ steps.latest.outputs.version }}"

name: Publish container image

on:
  create:

permissions:
  contents: read

jobs:
  release:
    name: Validate release tag
    if: github.repository == 'ahemberg/geobook' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the release commit and main history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate version and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.ref }}
        run: python3 scripts/publish-image.py validate "$RELEASE_TAG"

  checks:
    name: Release checks
    needs: release
    uses: ./.github/workflows/backend-tests.yml

  security:
    name: Release security
    needs: release
    uses: ./.github/workflows/security.yml

  publish:
    name: Publish verified image
    needs: [checks, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: geobook-container-publishing
      queue: max
    steps:
      - name: Checkout the release commit and main history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the verified application
        uses: actions/download-artifact@v8
        with:
          name: packaged-application
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish fixed version and update latest
        env:
          RELEASE_TAG: ${{ github.event.ref }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-image.py publish "$RELEASE_TAG"

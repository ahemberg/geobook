name: Backend checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run all checks, tests, and builds
        run: ./mvnw -B verify

      - name: Install browser for full-app tests
        working-directory: src/main/frontend
        run: node/node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Test the packaged app on desktop and mobile
        working-directory: src/main/frontend
        run: node/node node_modules/@playwright/test/cli.js test

      - name: Upload analysis and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            target/surefire-reports/
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
            src/main/frontend/test-results/
          if-no-files-found: ignore

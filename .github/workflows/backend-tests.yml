name: Backend checks

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check image publishing rules
        run: python3 -m unittest discover -s scripts -p 'test_publish_image.py'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run all checks, tests, and builds
        run: ./mvnw -B verify

      - name: Install browser for full-app tests
        working-directory: src/main/frontend
        run: node/node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Test the packaged app on desktop and mobile
        working-directory: src/main/frontend
        run: node/node node_modules/@playwright/test/cli.js test

      - name: Upload analysis and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            target/surefire-reports/
            target/checkstyle-result.xml
            target/pmd.xml
            target/spotbugsXml.xml
            src/main/frontend/test-results/
          if-no-files-found: ignore

      - name: Share the verified application with container checks
        uses: actions/upload-artifact@v7
        with:
          name: packaged-application
          path: target/tracker-0.0.1-SNAPSHOT.jar
          retention-days: 3

  container:
    name: Container checks (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download the verified application
        uses: actions/download-artifact@v8
        with:
          name: packaged-application
          path: target

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: src/main/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json

      - name: Install browser tests
        working-directory: src/main/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the native application image
        run: docker build --tag geobook:test .

      - name: Test Compose persistence and bundled browser journeys
        run: python3 scripts/container-smoke.py geobook:test --browser

      - name: Upload browser reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-reports-${{ matrix.arch }}
          path: src/main/frontend/test-results/
          if-no-files-found: ignore

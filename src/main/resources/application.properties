spring.application.name=tracker
geobook.upload-limit-mb=${GEOBOOK_UPLOAD_LIMIT_MB:512}
spring.servlet.multipart.max-file-size=${geobook.upload-limit-mb}MB
spring.servlet.multipart.max-request-size=${geobook.upload-limit-mb}MB
server.tomcat.max-swallow-size=-1
spring.servlet.multipart.file-size-threshold=0
server.error.include-message=never
geobook.auth.mode=${GEOBOOK_AUTH_MODE:password}
geobook.owner.user=${GEOBOOK_OWNER_USER:admin}
geobook.owner.password=${GEOBOOK_OWNER_PASSWORD:}
geobook.session.max-age=${GEOBOOK_SESSION_MAXAGE:1209600}
geobook.session.timeout=${GEOBOOK_SESSION_TIMEOUT:604800}
# Geobook keeps its own owner and session store; Spring Boot's generated user is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
